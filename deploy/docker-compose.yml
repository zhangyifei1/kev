services:
  kev:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kev-4b:latest
    container_name: kev-4b
    restart: unless-stopped
    ports:
      - "8009:8009"
    environment:
      # V100 (Volta sm_70): 无 bf16 硬件支持、无 TF32、跑不了 fla fused 内核
      # -> fp32 精确 eager 路径
      KEV_DTYPE: fp32
      KEV_FUSED: "0"
      # 压测发现:cuda graphs 私有池占 3GB,fp32 eager 部署收益小,关闭为长状态腾显存
      KEV_CUDA_GRAPHS: "0"
      # 缓存分配器可扩展段:减少碎片,OOM 时能归还显存
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # 限制 prefix cache 的状态 token 上限,控制 fp32 KV 占用(默认 65536 在 21GB 预算内太激进)
      KEV_PREFIX_MAX_TOKENS: "16384"
      KEV_MODEL: jaredpalmer/kev-4b
      KEV_BASE: Qwen/Qwen3.5-4B-Base
      KEV_PORT: "8009"
      HF_ENDPOINT: https://hf-mirror.com
      # hf-mirror 不支持 Xet(CAS) 协议,禁用后回退普通 HTTP 下载
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: /data/hf
    volumes:
      - hf-cache:/data/hf
    shm_size: 2g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]   # 固定用 1 卡
              capabilities: [gpu]
    healthcheck:
      # 镜像里没有 curl(apt 源不通装不了),用 python 标准库探活
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/v1/models', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30m   # 首次启动要下载约 9GB 模型

volumes:
  hf-cache:
